name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache face models (YuNet + SFace, checksum-verified)
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('memora/ml/models.py') }}

      # No API keys: AWS is stubbed with botocore's Stubber, heavy models are stubbed,
      # and only the small open-source face models are downloaded.
      - name: Run tests
        run: pytest -q
